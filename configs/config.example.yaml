scheduler:
  instance_id: "scheduler-001"  # 实例ID，分布式部署时每个实例应不同
  lock_key: "scheduler_leader_lock"
  lock_timeout: 30s
  heartbeat_interval: 10s
  max_workers: 10

health_check:
  enabled: true
  interval: 10s
  timeout: 3s
  failure_threshold: 2
  recovery_threshold: 1

database:
  host: mysql  # Docker环境中通常使用服务名或IP
  port: 3306
  database: jobs
  user: root
  password: "your_password"  # 请修改为实际密码
  max_connections: 100
  max_idle_connections: 25
  connection_max_lifetime: 10m

server:
  ip: 0.0.0.0  # Docker环境中监听所有接口
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  max_header_bytes: 1048576

log:
  level: info
  format: json
  output: stdout
  file: logs/scheduler.log

redis:
  enabled: true
  host: redis  # Docker环境中通常使用服务名或IP
  port: 6379
  password: ""  # 如有密码请填写
  db: 0
